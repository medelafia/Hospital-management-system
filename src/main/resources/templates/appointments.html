<!doctype html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
>
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Doctors</title>
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link th:href="@{/main.css}" rel="stylesheet" />
</head>
<body>
    <div layout:fragment="content">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a class="text-decoration-none text-dark" href="/">Home</a></li>
                <li class="breadcrumb-item active" aria-current="page"><a class="text-decoration-none text-dark" href="/appointment/">Appointments</a></li>
            </ol>
        </nav>
        <div class="d-flex align-items-center justify-content-between mb-3 bg-white p-3 rounded-3 border">
            <div class="d-flex" style="width: 40%">
                <input type="text" placeholder="search by username" class="form-control"/>
                <button class="btn rounded-3 c-btn-primary text-white ms-2 d-flex align-items-center"><i class="fa-solid fa-magnifying-glass me-2"></i>search</button>
            </div>
            <div class="d-flex align-items-center justify-content-end ">
                <form action="/appointment/" method="get" class="d-flex align-items-center justify-content-center">
                    <select id="status" name="status" class="form-select w-100">
                        <option value="NONE">--select status--</option>
                        <option value="RESERVED" th:selected='${status == "RESERVER"}'>RESERVED</option>
                        <option value="CANCELED" th:selected='${status == "CANCELED"}'>CANCELED</option>
                        <option value="COMPLETED" th:selected='${status == "COMPLETED"}'>COMPLETED</option>
                        <option value="APPROVED" th:selected='${status == "APPROVED"}'>APPROVED</option>
                    </select>
                    <select name="doctorId" class="form-select mx-1" >
                        <option value="-1">--select doctor--</option>
                        <option th:each="doctor  : ${doctors }" th:value="${doctor.getId()}" th:text='${doctor.getFirstName() + " " + doctor.getLastName()}' th:selected="${doctor.getId() == doctorId}" ></option>
                    </select>
                    <input class="form-control mx-1" name="date" type="date" placeholder="chose appointment date" th:value="${date}">
                    <button type="submit" class="btn c-bg-primary text-white rounded-3 ms-2 me-1"><i class="fa-solid fa-filter"></i></button>
                    <a class="btn c-outline-primary c-text-primary rounded-3 text-capitalize ms-1" th:href='@{${"/appointment/?size="+size + "&pageNumber="+pageNumber }}'><i class="fa-solid fa-xmark"></i></a>
                </form>
            </div>

        </div>

        <div class="border rounded-3 overflow-hidden">
            <table class="table mb-0">
                <thead>
                <tr>
                    <td>#AppointmentId</td>
                    <td>Doctor</td>
                    <td>Patient</td>
                    <td>Date</td>
                    <td>Time</td>
                    <td>Status</td>
                </tr>
                </thead>
                <tbody>
                    <tr th:if="${appointments.isEmpty()}"><td colspan="6">no appointments available</td></tr>
                    <tr th:each="appointment : ${appointments}">
                        <td th:text="${appointment.getId()}"></td>
                        <td th:text='${appointment.getDoctor().getLastName() + " "  + appointment.getDoctor().getFirstName()}'></td>
                        <td th:text='${appointment.getPatient().getLastName() + " " + appointment.getPatient().getFirstName()}'></td>
                        <td th:text="${appointment.getDate()}"></td>
                        <td th:text="${appointment.getStartTime()}"></td>
                        <td>
                            <div th:text="${appointment.getStatus()}" class="badge bg-danger" th:if='${appointment.getStatus().name().equalsIgnoreCase("CANCELED")}'></div>
                            <div th:text="${appointment.getStatus()}" class="badge bg-warning" th:if='${appointment.getStatus().name().equalsIgnoreCase("RESERVED")}'></div>
                            <div th:text="${appointment.getStatus()}" class="badge bg-success" th:if='${appointment.getStatus().name().equalsIgnoreCase("COMPLETED")}'></div>
                            <div th:text="${appointment.getStatus()}" class="badge bg-info" th:if='${appointment.getStatus().name().equalsIgnoreCase( "APPROVED" ) }'></div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="d-flex align-items-center justify-content-center mt-4 w-100">
            <a class="btn btn-outline-dark mx-1" th:each="number : ${numberOfPages}" th:href='@{${"/appointment/?size=" + size + "&pageNumber=" + number}}'  th:text="${number}" href="" ></a>
        </div>
    </div>


    <script src="/webjars/bootstrap/5.3.1/js/bootstrap.bundle.min.js"></script>
</body>
</html>
