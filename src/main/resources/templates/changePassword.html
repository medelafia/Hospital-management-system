<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
  <meta charset="UTF-8">
  <title>Edit My Profile</title>
  <link rel="stylesheet" href="/webjars/bootstrap/5.3.1/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link th:href="@{/main.css}" rel="stylesheet" />
</head>
<body class="h-100 bg-light">
  <div layout:fragment="content">
      <div class="container p-5 my-2">
              <form method="post" th:action="@{/user/change-password}" class="mx-5 py-5 px-5 border bg-white rounded ">
                <h2 class="fw-bold mb-4 c-text-primary">Change Password</h2>

                <div class="w-100">
                  <label for="currentPassword">Current Password :</label>
                  <input type="password" id="currentPassword" name="currentPassword" placeholder="enter the current password"  class="form-control w-100">
                </div>
                <div class="w-100">
                  <label for="newPassword">New Password :</label>
                  <input type="password" id="newPassword" name="newPassword" placeholder="enter the new password" class="form-control w-100">
                </div>
                <div class="form-group my-2">
                  <label for="confirmPassword">Confirm New Password :</label>
                  <input class="form-control" type="password" name="confirmPassword" id="confirmPassword" placeholder="confirm the new password">
                </div>
                <div class="d-flex align-items-center">
                  <input class="form-check me-2" type="checkbox" name="logout" id="logout">
                  <label for="logout">logout from account</label>
                </div>
                <div class="d-flex align-items-center justify-content-start mt-3">
                  <button class="btn c-btn-primary px-5 text-white" type="submit">
                    <i class="fa-solid fa-floppy-disk"></i> Change
                  </button>
                </div>
              </form>
            </div>
      </div>
  <script src="/webjars/bootstrap/5.3.1/js/bootstrap.bundle.min.js"></script>
</body>
</html>
