<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - HMS</title>
    <link
      rel="stylesheet"
      href="/webjars/bootstrap/5.3.1/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
    <link th:href="@{/main.css}" rel="stylesheet" />
    <style>
      body {
        min-height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      .login-container {
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        overflow: hidden;
        max-width: 1000px;
        width: 100%;
      }

      .login-left {
        padding: 50px 40px;
        background: white;
      }

      .login-right {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        padding: 50px 40px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: white;
      }

      .login-right img {
        max-width: 100%;
        height: auto;
      }

      .login-right h2 {
        font-weight: 700;
        margin-bottom: 10px;
      }

      .login-right p {
        opacity: 0.9;
        text-align: center;
      }

      .login-title {
        font-weight: 700;
        color: #333;
        font-size: 2rem;
        margin-bottom: 5px;
      }

      .login-subtitle {
        color: #888;
        font-size: 0.95rem;
        margin-bottom: 30px;
      }

      .form-group {
        margin-bottom: 20px;
      }

      .form-group label {
        font-weight: 600;
        color: #555;
        font-size: 0.9rem;
        margin-bottom: 8px;
        display: block;
      }

      .input-group-custom {
        position: relative;
      }

      .input-group-custom .input-icon {
        position: absolute;
        left: 15px;
        top: 50%;
        transform: translateY(-50%);
        color: #aaa;
        z-index: 10;
      }

      .input-group-custom .form-control {
        padding-left: 45px;
        height: 50px;
        border-radius: 10px;
        border: 2px solid #e8ecf1;
        transition: all 0.3s ease;
        font-size: 0.95rem;
      }

      .input-group-custom .form-control:focus {
        border-color: #667eea;
        box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
      }

      .input-group-custom .toggle-password {
        position: absolute;
        right: 15px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: #aaa;
        cursor: pointer;
        z-index: 10;
      }

      .input-group-custom .toggle-password:hover {
        color: #667eea;
      }

      .login-btn {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        padding: 14px;
        border-radius: 10px;
        font-weight: 600;
        font-size: 1rem;
        width: 100%;
        transition: all 0.3s ease;
        cursor: pointer;
      }

      .login-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        color: white;
      }

      .login-btn:active {
        transform: translateY(0);
      }

      .alert-custom {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 9999;
        min-width: 300px;
        border-radius: 12px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
        padding: 15px 20px;
      }

      .alert-custom .btn-close {
        padding: 0.5rem;
      }

      .forgot-password {
        text-align: right;
        margin-top: 5px;
      }

      .forgot-password a {
        color: #888;
        text-decoration: none;
        font-size: 0.85rem;
        transition: color 0.3s ease;
      }

      .forgot-password a:hover {
        color: #667eea;
      }

      .register-link {
        text-align: center;
        margin-top: 20px;
        color: #888;
      }

      .register-link a {
        color: #667eea;
        font-weight: 600;
        text-decoration: none;
      }

      .register-link a:hover {
        text-decoration: underline;
      }

      /* Error state */
      .input-group-custom .form-control.is-invalid {
        border-color: #dc3545;
      }

      .input-group-custom .form-control.is-invalid:focus {
        box-shadow: 0 0 0 4px rgba(220, 53, 69, 0.15);
      }

      .invalid-feedback-custom {
        color: #dc3545;
        font-size: 0.8rem;
        margin-top: 5px;
      }

      @media (max-width: 768px) {
        .login-right {
          display: none;
        }
        .login-left {
          padding: 30px 20px;
        }
        .login-container {
          margin: 20px;
        }
        .alert-custom {
          min-width: unset;
          width: 90%;
          right: 5%;
        }
      }

      /* Animation */
      @keyframes slideDown {
        from {
          transform: translateY(-100px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      .alert-custom {
        animation: slideDown 0.5s ease;
      }
    </style>
  </head>
  <body>
    <!-- Alert Messages -->
    <div
      th:if="${error}"
      class="alert alert-danger alert-dismissible fade show alert-custom"
      role="alert"
    >
      <i class="fa-solid fa-circle-exclamation me-2"></i>
      <strong>Login Failed!</strong>
      <span th:text="${error}"></span>
      <button
        type="button"
        class="btn-close"
        data-bs-dismiss="alert"
        aria-label="Close"
      ></button>
    </div>

    <div
      th:if="${logout}"
      class="alert alert-success alert-dismissible fade show alert-custom"
      role="alert"
    >
      <i class="fa-solid fa-check-circle me-2"></i>
      <strong>Logged Out!</strong>
      <span th:text="${logout}"></span>
      <button
        type="button"
        class="btn-close"
        data-bs-dismiss="alert"
        aria-label="Close"
      ></button>
    </div>

    <div class="login-container">
      <div class="row g-0">
        <!-- Left Side - Login Form -->
        <div class="col-lg-7 login-left">
          <div>
            <h1 class="login-title">
              <i
                class="fa-solid fa-heart-pulse me-2"
                style="color: #667eea"
              ></i>
              HMS
            </h1>
            <p class="login-subtitle">
              Welcome back! Please login to your account.
            </p>
          </div>

          <form th:action="@{/login}" method="post">
            <!-- Username -->
            <div class="form-group">
              <label for="username">
                <i class="fa-regular fa-user me-1"></i> Username
              </label>
              <div class="input-group-custom">
                <span class="input-icon">
                  <i class="fa-regular fa-user"></i>
                </span>
                <input
                  name="username"
                  id="username"
                  placeholder="Enter your username"
                  type="text"
                  class="form-control"
                  required
                />
              </div>
            </div>

            <!-- Password -->
            <div class="form-group">
              <label for="password">
                <i class="fa-regular fa-lock me-1"></i> Password
              </label>
              <div class="input-group-custom">
                <span class="input-icon">
                  <i class="fa-regular fa-lock"></i>
                </span>
                <input
                  type="password"
                  id="password"
                  placeholder="Enter your password"
                  name="password"
                  class="form-control"
                  required
                />
                <button
                  type="button"
                  class="toggle-password"
                  onclick="togglePassword()"
                >
                  <i class="fa-regular fa-eye" id="toggleIcon"></i>
                </button>
              </div>
            </div>

            <!-- Forgot Password -->
            <div class="forgot-password">
              <a href="#"
                ><i class="fa-regular fa-key me-1"></i> Forgot password?</a
              >
            </div>

            <!-- Login Button -->
            <button class="login-btn mt-3" type="submit">
              <i class="fa-solid fa-arrow-right-to-bracket me-2"></i> Login
            </button>
          </form>
        </div>

        <!-- Right Side - Image/Branding -->
        <div class="col-lg-5 login-right">
          <img th:src="@{/images/img.png}" alt="Healthcare" width="200" />
          <h2 class="mt-4">Healthcare Management</h2>
          <p>
            Manage your patients, appointments, and medical records efficiently.
          </p>
          <div class="mt-3">
            <span class="badge bg-light text-dark me-1"
              ><i class="fa-regular fa-check-circle me-1"></i> Secure</span
            >
            <span class="badge bg-light text-dark me-1"
              ><i class="fa-regular fa-clock me-1"></i> 24/7 Access</span
            >
            <span class="badge bg-light text-dark"
              ><i class="fa-regular fa-users me-1"></i> Multi-user</span
            >
          </div>
        </div>
      </div>
    </div>

    <script>
      // Toggle password visibility
      function togglePassword() {
        const passwordInput = document.getElementById("password");
        const toggleIcon = document.getElementById("toggleIcon");

        if (passwordInput.type === "password") {
          passwordInput.type = "text";
          toggleIcon.className = "fa-regular fa-eye-slash";
        } else {
          passwordInput.type = "password";
          toggleIcon.className = "fa-regular fa-eye";
        }
      }

      // Auto-hide alerts after 5 seconds
      document.addEventListener("DOMContentLoaded", function () {
        const alerts = document.querySelectorAll(".alert-custom");
        alerts.forEach((alert) => {
          setTimeout(function () {
            const closeButton = alert.querySelector(".btn-close");
            if (closeButton) {
              closeButton.click();
            }
          }, 5000);
        });
      });
    </script>

    <script src="/webjars/bootstrap/5.3.1/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
