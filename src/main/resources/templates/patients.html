<!doctype html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout}"
>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Patients</title>
    <link th:href="@{/main.css}" rel="stylesheet" />
  </head>
  <body>
    <div layout:fragment="content">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item">
            <a class="text-decoration-none text-dark" href="/">Home</a>
          </li>
          <li class="breadcrumb-item active" aria-current="page">
            <a class="text-decoration-none text-dark" href="/patient/"
              >Patients</a
            >
          </li>
        </ol>
      </nav>
      <div
        class="d-flex align-items-center justify-content-start mb-3 bg-white p-3 rounded-3 border"
      >
        <form
          action="/patient/"
          method="get"
          class="d-flex align-items-center justify-content-center"
        >
          <input
            th:value="${search}"
            type="text"
            name="search"
            id=""
            class="form-control"
            placeholder="enter the name or speciality"
          />
          <button
            type="submit"
            class="btn rounded-3 c-btn-primary text-white ms-2 d-flex align-items-center"
          >
            <i class="fa-solid fa-magnifying-glass me-2"></i>search
          </button>
        </form>

      </div>

      <div class="border rounded-3 overflow-hidden">
        <table class="table table-hover mb-0">
          <thead>
            <tr>
              <td>#</td>
              <td>first Name</td>
              <td>last Name</td>
              <td>cin</td>
              <td>birth date</td>
              <td>actions</td>
            </tr>
          </thead>
          <tbody>
            <tr th:if="${patients.isEmpty()}">
              <td colspan="6">no patients available</td>
            </tr>
            <tr th:each="patient : ${patients}">
              <td th:text="${patient.getId()}"></td>
              <td th:text="${patient.getFirstName()}"></td>
              <td th:text="${patient.getLastName()}"></td>
              <td th:text="${patient.getCin()}"></td>
              <td th:text="${patient.getBirthDate()}"></td>
              <td>
                <form
                  th:action="@{/patient/delete/{id}(id=${patient.getId()})}"
                  method="post"
                >
                  <button class="btn">
                    <i class="fa-solid fa-trash text-danger"></i>
                  </button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </body>
</html>
