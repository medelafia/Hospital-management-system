<!doctype html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
>
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Patients</title>
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link th:href="@{/main.css}" rel="stylesheet" />
</head>
<body>
    <div layout:fragment="content">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a class="text-decoration-none text-dark" href="/">Home</a></li>
                <li class="breadcrumb-item active" aria-current="page"><a class="text-decoration-none text-dark" href="/patient/">Patients</a></li>
            </ol>
        </nav>
        <div class="d-flex align-items-center justify-content-between mb-3 bg-white p-3 rounded-3 border">
            <form action="/patient/" method="get" class="d-flex align-items-center justify-content-center">
                <input th:value="${search}" type="text" name="search" id="" class="form-control" placeholder="enter the name or speciality">
                <button type="submit" class="btn rounded-3 c-btn-primary text-white ms-2 d-flex align-items-center"><i class="fa-solid fa-magnifying-glass me-2"></i>search</button>
            </form>
            <button class="btn c-outline-primary c-text-primary rounded-3 text-capitalize" data-bs-toggle="modal" data-bs-target="#addPatientModal"><i class="fa-solid fa-plus me-2"></i>Add patient</button>
        </div>
        <div class="modal fade" id="addPatientModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="exampleModalLabel">Add Doctor</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form action="/patient/" method="post" class="p-4">
                            <div class="form-group  my-2">
                                <label for="lastName">First name</label>
                                <input id="lastName" name="firstName" class="form-control" type="text" placeholder="enter the first name of patient" >
                            </div>
                            <div class="form-group my-2">
                                <label for="firstName">Last name</label>
                                <input class="form-control" name="lastName" type="text" placeholder="enter the last nam of patient" id="firstName">
                            </div>
                            <div class="form-group my-2">
                                <label for="cin">Identical card number</label>
                                <input class="form-control" type="text" name="cin" id="cin" placeholder="enter the cin date of patient">
                            </div>
                            <div class="form-group my-2">
                                <label for="birthDate">Birth date</label>
                                <input class="form-control" type="date" name="birthDate" id="birthDate" placeholder="enter the birth date of patient">
                            </div>
                            <div class="d-flex align-items-center justify-content-end mt-3">
                                <button class="btn btn-outline-danger px-2 me-2" type="reset">
                                    <i class="fa-solid fa-floppy-disk" ></i> Cancel
                                </button>
                                <button class="btn btn-danger px-2" type="submit">
                                    <i class="fa-solid fa-floppy-disk"></i> Save
                                </button>
                            </div>
                        </form>
                    </div>

                </div>
            </div>
        </div>
        <div class="border rounded-3 overflow-hidden">
            <table class="table table-hover  mb-0">
                <thead>
                <tr>
                    <td>#</td>
                    <td>first Name</td>
                    <td>last Name</td>
                    <td>cin</td>
                    <td>birth date</td>
                    <td>actions</td>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${patients.isEmpty()}"><td colspan="6">no patients available</td></tr>
                <tr th:each="patient : ${patients}">
                    <td th:text="${patient.getId()}"></td>
                    <td th:text="${patient.getFirstName()}"></td>
                    <td th:text="${patient.getLastName()}"></td>
                    <td th:text="${patient.getCin()}"></td>
                    <td th:text="${patient.getBirthDate()}"></td>
                    <td>
                        <form th:action="@{/patient/delete/{id}(id=${patient.getId()})}" method="post">
                            <button class="btn"><i class="fa-solid fa-trash text-danger"></i></button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
    <script src="/webjars/bootstrap/5.3.1/js/bootstrap.bundle.min.js"></script>
</body>
</html>
