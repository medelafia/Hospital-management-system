<!doctype html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout}"
>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Patients</title>
    <link th:href="@{/main.css}" rel="stylesheet" />
  </head>
  <body>
    <div layout:fragment="content">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item">
            <a class="text-decoration-none text-dark" href="/">Home</a>
          </li>
          <li class="breadcrumb-item active" aria-current="page">
            <a class="text-decoration-none text-dark" href="/user/">Users</a>
          </li>
        </ol>
      </nav>
      <div
        class="d-flex align-items-center justify-content-between mb-3 bg-white p-3 rounded-3 border"
      >
        <div class="w-50 d-flex">
          <input
            type="text"
            placeholder="search by username"
            class="form-control"
          />
          <button
            class="btn rounded-3 c-btn-primary text-white ms-2 d-flex align-items-center"
          >
            <i class="fa-solid fa-magnifying-glass me-2"></i>search
          </button>
        </div>
        <a
          class="btn c-outline-primary c-text-primary rounded-3 text-capitalize"
          data-bs-toggle="modal"
          data-bs-target="#addUserModal"
          >add user<i class="fa-solid fa-plus ms-1"></i
        ></a>
      </div>
      <div
        class="modal fade"
        id="addUserModal"
        tabindex="-1"
        aria-labelledby="exampleModalLabel"
        aria-hidden="true"
      >
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-header">
              <h1 class="modal-title fs-5" id="exampleModalLabel">Add User</h1>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body">
              <form th:action="@{/user/}" method="post" class="p-4">
                <div class="form-group my-2">
                  <label for="username">Username</label>
                  <input
                    id="username"
                    name="username"
                    class="form-control"
                    type="text"
                    placeholder="enter the username"
                  />
                </div>
                <div class="form-group my-2">
                  <label for="email">Email</label>
                  <input
                    class="form-control"
                    name="email"
                    type="email"
                    placeholder="enter the email of user"
                    id="email"
                  />
                </div>
                <div class="form-group my-2">
                  <label for="role">Role</label>
                  <select class="form-select" multiple name="roles" id="role">
                    <option value="ROLE_DOCTOR">Doctor</option>
                    <option value="ROLE_ADMIN">Admin</option>
                    <option value="ROLE_PATIENT">Patient</option>
                  </select>
                </div>

                <div class="form-group my-2">
                  <label for="password">Password</label>
                  <input
                    class="form-control"
                    type="password"
                    name="password"
                    id="password"
                    placeholder="enter the Password of user"
                  />
                </div>

                <div class="d-flex align-items-center justify-content-end mt-3">
                  <button class="btn btn-outline-danger px-2 me-2" type="reset">
                    <i class="fa-solid fa-floppy-disk"></i> Cancel
                  </button>
                  <button class="btn btn-danger px-2" type="submit">
                    <i class="fa-solid fa-floppy-disk"></i> Save
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
      <div class="border rounded-3 overflow-hidden">
        <table class="table table-hover mb-0">
          <thead>
            <tr>
              <td>#</td>
              <td>Username</td>
              <td>email</td>
              <td>role</td>
              <td>actions</td>
            </tr>
          </thead>
          <tbody>
            <tr th:if="${users.isEmpty()}">
              <td colspan="5">no users available</td>
            </tr>
            <tr th:each="user : ${users}">
              <td th:text="${user.getId()}"></td>
              <td th:text="${user.getUsername()}"></td>
              <td
                th:text='${(user.getEmail() != null ) ? user.getEmail() : "Not exists"}'
              ></td>
              <td>
                <div
                  th:each="role : ${user.getRoles()}"
                  th:text="${role.getRoleName()}"
                  class="badge bg-success"
                ></div>
              </td>
              <td>
                <form
                  th:if="${!#authentication.getName().equalsIgnoreCase(user.getUsername())}"
                  class=""
                  method="post"
                  th:action='@{${"/user/" + user.getId() + "/delete"}}'
                >
                  <button class="btn">
                    <i class="fa-solid fa-trash text-danger"></i>
                  </button>
                </form>
                <p
                  th:if="${#authentication.getName().equalsIgnoreCase(user.getUsername())}"
                  class="badge bg-danger text-capitalize"
                >
                  <i class="fa-solid fa-lock me-2"></i>
                  cannot delete your account
                </p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </body>
</html>
